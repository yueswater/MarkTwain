appId: tw.marktwain.app
productName: MarkTwain
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Window icon for Windows and Linux, packaged as resources/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
  # The PDF viewer of the preview reads its engine from here, so it works offline
  - from: node_modules/@embedpdf/snippet/dist/pdfium.wasm
    to: pdfium.wasm
  # The Typst template travels with the app. Folders only needed for development are left out.
  - from: ../../resources/templates/typ
    to: resources/templates/typ
    filter:
      - "**/*"
      - "!.git/**"
      - "!.github/**"
      - "!.vscode/**"
      - "!docs/**"
      - "!tests/**"

mac:
  icon: build/icon.icns
  # Development and CI builds are not signed. Signing and notarization are
  # decided with the release workflow.
  identity: null
win:
  icon: build/icon.ico
linux:
  # Without this the executable is named after the scoped package name.
  executableName: marktwain
  icon: build/icons
