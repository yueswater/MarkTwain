appId: tw.marktwain.app
productName: MarkTwain
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# Window icon for Windows and Linux, packaged as resources/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
  # The library of table templates, one folder for each field of study
  - from: ../../resources/table-templates
    to: table-templates
  # The PDF viewer of the preview reads its engine from here, so it works offline
  - from: node_modules/@embedpdf/snippet/dist/pdfium.wasm
    to: pdfium.wasm
  # The Typst template travels with the app. Folders only needed for development are left out.
  - from: ../../resources/templates/typ
    to: resources/templates/typ
    filter:
      - "**/*"
      - "!.git/**"
      - "!.github/**"
      - "!.vscode/**"
      - "!docs/**"
      - "!tests/**"
  # The LaTeX template, only what a build reads. The tutorial chapters, figures and documents of the template stay out.
  - from: ../../resources/templates/tex
    to: resources/templates/tex
    filter:
      - tw-thesis.cls
      - tw-thesis.sty
      - latexmkrc
      - assets/**
      - fonts/**
      - i18n/**
      - schools/**
      - scripts/**
  # Typst is pinned in typst.lock.json and fetched by pnpm typst:fetch. Only the folder of the platform being built is packed.
  - from: ../../resources/typst/${os}-${arch}
    to: typst
    filter:
      - typst
      - typst.exe
  # Packages the template imports, so the first build needs no network.
  - from: ../../resources/typst-packages
    to: typst-packages
    filter:
      - "**/*"
      - "!**/.marktwain-typst.json"

mac:
  icon: build/icon.icns
  # Development and CI builds are not signed. Signing and notarization are
  # decided with the release workflow.
  identity: null
win:
  icon: build/icon.ico
linux:
  # Without this the executable is named after the scoped package name.
  executableName: marktwain
  icon: build/icons
