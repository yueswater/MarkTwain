name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include-macos:
        description: Also run on macOS
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include-macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    env:
      # Unit tests do not need the Electron binary, so skip the download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the pinned Typst and its packages
        run: pnpm typst:fetch
      - name: Use the fetched Typst in the unit tests
        shell: bash
        run: |
          key=$(node -e 'const os = { darwin: "mac", win32: "win", linux: "linux" }[process.platform]; console.log(`${os}-${process.arch}`)')
          exe=typst
          if [ "$RUNNER_OS" = "Windows" ]; then exe=typst.exe; fi
          echo "MARKTWAIN_TYPST=$GITHUB_WORKSPACE/resources/typst/$key/$exe" >> "$GITHUB_ENV"
          echo "MARKTWAIN_TYPST_PACKAGES=$GITHUB_WORKSPACE/resources/typst-packages" >> "$GITHUB_ENV"
      - name: Install a TeX Live for the LaTeX output
        shell: bash
        run: bash tools/ci/install-texlive.sh
      - name: Fetch the pinned templates
        run: pnpm templates:fetch typ
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch the pinned LaTeX template
        run: pnpm templates:fetch tex
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  package:
    name: package (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include-macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No MARKTWAIN_TYPST here, the end-to-end tests must use the Typst inside the packaged app.
      - name: Fetch the pinned Typst and its packages
        run: pnpm typst:fetch
      - name: Install a TeX Live for the LaTeX output
        shell: bash
        run: bash tools/ci/install-texlive.sh
      - name: Fetch the pinned templates
        run: pnpm templates:fetch typ
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch the pinned LaTeX template
        run: pnpm templates:fetch tex
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build:unpacked
      - name: End-to-end tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e:headed
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm e2e:headed
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: |
            apps/desktop/e2e-output
            apps/desktop/test-results
          if-no-files-found: ignore
      - name: Upload the unpacked Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: app-win-unpacked
          path: apps/desktop/dist/win-unpacked
          retention-days: 7
